# Maps LeRobot follower readings to our joint vector. Only arm/driver.py reads this file.
#
# LeRobot (use_degrees=True) reports each arm joint in degrees and the gripper on a 0 to 100 scale; our code
# uses radians and a gripper value from 0.0 (closed) to 1.0 (open). Per joint:
#   q_rad = radians(sign * lerobot_deg + offset_deg)
#   lerobot_deg = (degrees(q_rad) - offset_deg) / sign
# Gripper:
#   gripper = (pct - closed_pct) / (open_pct - closed_pct), clipped to [0, 1]
#
# MEASURED 2026-10-17 21:39 (A6 steps 1 to 3): signs from the jog-joint sign test (all five turn the same
# way as the model) and offsets solved from one reference pose, the model's zero pose (arm straight forward,
# forearm and gripper level, moving jaw on top), report runs/calibration/reference-zero-pose.json, solve
# record runs/calibration/solve-20261018-013942-662672.json, encoder calibration sha256 5494adfa...bbe6c.
# The five-pose check (A6 step 4) ran at 22:20 and did not formally pass: mean 2.2 cm, max 3.1 cm
# (runs/calibration/a6-check/check-01.json). The gripper's empty_closed_pct is A11's
# measured close on nothing (runs/calibration/gripper-20261018T030005Z.json, 2026-10-17 23:00). Redo A6
# after any recalibration: LeRobot's 0 is the midpoint of each joint's calibrated range, so the offsets
# depend on the calibration file.
#
# lerobot_robot_type is the registry name for `--robot.type`. The demo laptop's LeRobot 0.6.2 (Seeed fork,
# module lerobot.robots.so_follower) registers SOFollowerRobotConfig under both "so101_follower" and
# "so100_follower" (config_so_follower.py), so this value works there and on upstream releases.
lerobot_id: my_awesome_follower_arm
lerobot_robot_type: so101_follower
shoulder_pan: {sign: 1, offset_deg: 7.956}
shoulder_lift: {sign: 1, offset_deg: -1.582}
elbow_flex: {sign: 1, offset_deg: -8.044}
wrist_flex: {sign: 1, offset_deg: -1.055}
wrist_roll: {sign: 1, offset_deg: 3.473}
# open_pct 51 makes our gripper 1.0 the model's full opening (1.17 rad of jaw swing from closed, about 10 cm
# between the tips, arm/sim_robot.py). The calibrated range reaches about 134 degrees (15 cm measured
# 2026-10-18), so 100 would open the real jaws about 5 cm wider than the plans allow for. Closed is raw 2047
# (2.2 %); 763 ticks (1.17 rad) further is raw 2810 = 51 % of the 2012-3577 range. Measured at 51 (A11,
# 2026-10-18 11:14, runs/calibration/gripper-20261018T151451Z.json, after restoring this calibration into the
# motors): 95.25 mm between the tips, open reading 50.7, empty close 1.3 (02:48 run: 96 mm, 1.9).
gripper: {closed_pct: 0, open_pct: 51, empty_closed_pct: 1.3, jaw_open_mm: 95.25}
